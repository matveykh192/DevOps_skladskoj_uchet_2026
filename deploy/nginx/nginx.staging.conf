# конфигурация nginx для предэксплуатационного окружения (staging)
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ограничение частоты запросов для staging
    limit_req_zone $binary_remote_addr zone=staging_limit:10m rate=30r/s;

    upstream staging_backend {
        server staging-app:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # заголовок с указанием узла
        add_header X-Served-By staging-app always;

        location / {
            limit_req zone=staging_limit burst=15 nodelay;

            proxy_pass http://staging_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # служебный адрес для healthcheck прокси
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
