events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting: 50 requests per second per IP with burst 20 (Requirement 7)
    limit_req_zone $binary_remote_addr zone=warehouse_limit:10m rate=50r/s;

    # Logging format including upstream address and response time
    log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time" '
                                'upstream=$upstream_addr instance=$upstream_http_x_instance_id';

    access_log /var/log/nginx/access.log upstream_logging;
    error_log  /var/log/nginx/error.log warn;

    upstream warehouse_backend {
        # Round-robin load balancing (Requirement 4)
        # Upstream service 'app' resolved by Docker internal DNS across replicas
        server app:8000 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Expose which upstream backend served the request in HTTP response headers (Requirement 5)
        add_header X-Served-By $upstream_addr always;

        location / {
            limit_req zone=warehouse_limit burst=20 nodelay;

            proxy_pass http://warehouse_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover retry: if an instance is stopped or fails, immediately retry on another instance (Requirement 6 & 7)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Dedicated health check endpoint for reverse proxy
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
