<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему — Складской учёт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-2">ИС Складской учёт</h3>
                        <h5 class="text-center text-muted mb-4">Авторизация</h5>

                        <div id="loginAlert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Логин *</label>
                                <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль *</label>
                                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="loginSubmitBtn">Войти в систему</button>
                        </form>

                        <hr class="my-4">
                        <h6 class="text-muted text-center mb-3">Тестовые аккаунты:</h6>
                        <div class="text-center">
                            <small class="text-muted d-block">Администратор: <code>admin</code> / <code>admin123</code></small>
                            <small class="text-muted d-block">Кладовщик: <code>storekeeper</code> / <code>worker123</code></small>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3 text-muted">
                    <small>© 2026 ИС Складской учёт • FastAPI + PostgreSQL + Docker</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js?v=6"></script>
</body>
</html>
