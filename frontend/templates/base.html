<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Складской учёт (ИС-СУ){% endblock %}</title>

    <!-- Bootstrap 5 CSS CDN (без установки дополнительных пакетов) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Пользовательские стили -->
    <link rel="stylesheet" href="../static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Главная навигационная панель -->
    <header>
        <nav class="navbar navbar-expand-lg app-navbar shadow-sm" aria-label="Основная навигация">
            <div class="container-fluid px-lg-4">
                <a class="navbar-brand" href="materials.html">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2" aria-hidden="true">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <span>ИС Складской учёт</span>
                </a>
                <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#warehouseNavbar" aria-controls="warehouseNavbar" aria-expanded="false" aria-label="Переключить навигацию">
                    <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                </button>

                <div class="collapse navbar-collapse" id="warehouseNavbar">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-lg-1">
                        <li class="nav-item">
                            <a class="nav-link" href="materials.html">Материалы</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="receipts.html">Поступления</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="issues.html">Расход</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <div class="user-badge d-none d-sm-inline-flex align-items-center">
                            <span class="me-1">👤</span>
                            <span id="userDisplayName">Кладовщик</span>
                        </div>
                        <a href="login.html" id="logoutBtn" class="btn btn-sm btn-outline-light" role="button">
                            Выйти
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Основной контент страницы -->
    <main class="container-fluid px-lg-4 my-4 flex-grow-1" id="mainContent">
        {% block content %}{% endblock %}
    </main>

    <!-- Корпоративный подвал -->
    <footer class="app-footer">
        <div class="container-fluid px-lg-4 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
            <div>
                <strong>Информационная система складского учёта (ИС-СУ)</strong> &bull; Лабораторная работа №1
            </div>
            <div class="text-muted">
                FastAPI &bull; PostgreSQL &bull; Jinja2 &bull; Docker
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Клиентский скрипт взаимодействия с API -->
    <script src="../static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
